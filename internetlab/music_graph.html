<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Artist Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0b0d12; --bg2:#11141c; --surface:#181c28;
  --border:rgba(255,255,255,0.08); --text:#e2e4ec; --muted:#6b7080;
  --accent:#a78bfa; --hot:#f472b6; --selected:#fbbf24;
}
body { background:var(--bg); color:var(--text); font-family:'SF Mono','Fira Code',monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#toolbar { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
#toolbar h1 { font-size:13px; font-weight:600; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; }
input[type=text] { background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:inherit; font-size:13px; padding:5px 10px; outline:none; width:180px; }
input[type=text]:focus { border-color:var(--accent); }
button { background:var(--accent); border:none; border-radius:6px; color:#0b0d12; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; letter-spacing:.05em; padding:6px 14px; text-transform:uppercase; }
button.sec { background:var(--surface); color:var(--muted); border:1px solid var(--border); }
button:hover { opacity:.85; } button:disabled { opacity:.3; cursor:not-allowed; }
#stats { font-size:11px; color:var(--muted); margin-left:auto; }
#main { display:flex; flex:1; overflow:hidden; }
#canvas-wrap { flex:1; position:relative; overflow:hidden; }
svg#graph { width:100%; height:100%; }
.link { stroke:rgba(255,255,255,0.1); fill:none; }
.link.strong { stroke:rgba(255,255,255,0.25); }
.link.highlight { stroke:var(--selected); stroke-width:2; }
.node-circle { cursor:pointer; }
.node-circle:hover { filter:brightness(1.35); }
.node-circle.selected { stroke:#fff; stroke-width:2.5; }
.node-label { pointer-events:none; text-anchor:middle; font-family:inherit; }
#sidebar { width:290px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
#sb-header { padding:12px 16px 8px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
#sb-name { font-size:18px; font-weight:700; padding:12px 16px 0; color:var(--text); line-height:1.2; }
#sb-genres { padding:4px 16px 0; font-size:11px; color:var(--accent); line-height:1.8; }
#sb-meta { font-size:11px; color:var(--muted); padding:6px 16px 10px; line-height:1.8; border-bottom:1px solid var(--border); }
.meta-row { display:flex; justify-content:space-between; }
.meta-val { color:var(--text); font-weight:600; }
#sb-relations { flex:1; overflow-y:auto; padding:8px 16px; }
#sb-relations::-webkit-scrollbar { width:4px; }
#sb-relations::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.rel-group-title { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:8px 0 5px; }
.rel-item { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); cursor:pointer; }
.rel-item:hover .rel-name { color:#fff; }
.rel-name { font-size:11px; color:var(--text); flex:1; }
.rel-type { font-size:10px; color:var(--muted); }
.rel-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
#expand-wrap { padding:10px 16px; border-top:1px solid var(--border); flex-shrink:0; }
#expand-wrap button { width:100%; font-size:11px; padding:7px; }
#legend { padding:10px 16px; border-top:1px solid var(--border); flex-shrink:0; font-size:11px; color:var(--muted); }
#loading { position:absolute; inset:0; background:rgba(11,13,18,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-size:13px; color:var(--muted); z-index:10; }
#loading.hidden { display:none; }
.spin { width:26px; height:26px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="toolbar">
  <h1>🎵 Music Graph</h1>
  <input id="seed-input" type="text" value="Radiohead" placeholder="Artist name…" />
  <button id="start-btn" onclick="startGraph()">▶ Start</button>
  <button class="sec" onclick="resetGraph()">Reset</button>
  <span id="stats"></span>
</div>
<div id="main">
  <div id="canvas-wrap">
    <svg id="graph"></svg>
    <div id="loading"><div class="spin"></div><span id="load-msg">Enter an artist and click Start.</span></div>
  </div>
  <div id="sidebar">
    <div id="sb-header">Artist details</div>
    <div id="sb-name" style="color:var(--muted);font-size:13px;padding-top:16px">Click any node</div>
    <div id="sb-genres"></div>
    <div id="sb-meta"></div>
    <div id="sb-relations">
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Start a graph and click any node to explore connections.</p>
    </div>
    <div id="expand-wrap" style="display:none">
      <button id="exp-btn" onclick="expandSelected()">+ Expand this artist</button>
    </div>
    <div id="legend">Node size = artist popularity · Edge thickness = relationship strength</div>
  </div>
</div>
<script>
const MB   = "https://musicbrainz.org/ws/2";
const MBHD = { "User-Agent": "cs108-lab/1.0 (cs108@wallawalla.edu)" };
const MAX_RELATIONS = 12;
const SLEEP = 300;  // MusicBrainz rate limit: ~1 req/sec

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Relation types we care about
const INTERESTING_TYPES = new Set([
  "member of band","is person","collaboration","tribute artist",
  "influenced by","influence","supporting musician","conductor",
  "subgroup","founded by","sibling","parent","associated act",
]);

let nodes = [], links = [], nodeMap = new Map();
let selectedNode = null;
let simulation, svg, g, gLinks, gNodes;

function showLoad(on, msg) {
  document.getElementById("loading").classList.toggle("hidden", !on);
  if (msg) document.getElementById("load-msg").textContent = msg;
}
function updateStats() {
  document.getElementById("stats").textContent =
    `${nodes.length} artists · ${links.length} connections`;
}

// ── MusicBrainz API ──────────────────────────────────────────────────────────

async function searchArtist(query) {
  await sleep(SLEEP);
  const p = new URLSearchParams({ query, fmt: "json", limit: 5 });
  const r = await fetch(`${MB}/artist?${p}`, { headers: MBHD });
  const d = await r.json();
  return (d.artists || [])[0] || null;
}

async function getArtistFull(mbid) {
  await sleep(SLEEP);
  const p = new URLSearchParams({
    inc: "artist-rels+tags+genres+ratings",
    fmt: "json"
  });
  const r = await fetch(`${MB}/artist/${mbid}?${p}`, { headers: MBHD });
  return r.json();
}

function parseArtistData(d) {
  const genres = [
    ...(d.genres || []).map(g => g.name),
    ...(d.tags   || []).filter(t => t.count > 0).map(t => t.name).slice(0, 5),
  ].filter((v,i,a) => a.indexOf(v)===i).slice(0, 8);

  const relations = (d.relations || [])
    .filter(r => r["target-type"] === "artist" && r.artist)
    .map(r => ({
      mbid:     r.artist.id,
      name:     r.artist.name,
      type:     r.type,
      direction: r.direction,
    }))
    .slice(0, MAX_RELATIONS);

  return {
    mbid:       d.id,
    name:       d.name,
    type:       d.type,
    country:    d.country,
    beginYear:  d["life-span"]?.begin?.slice(0,4),
    endYear:    d["life-span"]?.end?.slice(0,4),
    rating:     d.rating?.value,
    genres,
    relations,
    disambiguation: d.disambiguation,
  };
}

// ── Node color by genre cluster ──────────────────────────────────────────────

const GENRE_COLORS = {
  rock:      "#f97316", metal:"#ef4444", pop:"#f472b6",
  jazz:      "#fbbf24", classical:"#60a5fa", electronic:"#a78bfa",
  "hip-hop": "#34d399", folk:"#86efac", country:"#fde68a",
  soul:      "#fb923c", reggae:"#4ade80", blues:"#38bdf8",
};

function artistColor(d) {
  if (!d.genres) return "#6b7080";
  for (const g of d.genres) {
    for (const [key, col] of Object.entries(GENRE_COLORS)) {
      if (g.toLowerCase().includes(key)) return col;
    }
  }
  return "#a78bfa";
}

function nodeRadius(d) {
  return d.id === nodes[0]?.id ? 18 :
         d.expanded ? 14 : 10;
}

// ── Graph state ──────────────────────────────────────────────────────────────

function addNode(id, data) {
  if (nodeMap.has(id)) return nodeMap.get(id);
  const n = { id, ...data, expanded: false };
  nodes.push(n);
  nodeMap.set(id, n);
  return n;
}

function addLink(sourceId, targetId, relType) {
  const key = [sourceId, targetId].sort().join("|||");
  const exists = links.some(l => {
    const s = l.source?.id||l.source, t = l.target?.id||l.target;
    return [s,t].sort().join("|||") === key;
  });
  if (!exists) links.push({ source: sourceId, target: targetId, type: relType });
}

async function expandArtist(node) {
  if (node.expanded) return;
  node.expanded = true;
  showLoad(true, `Fetching: ${node.name}…`);

  const raw  = await getArtistFull(node.mbid);
  const data = parseArtistData(raw);
  Object.assign(node, data);

  for (const rel of data.relations) {
    addNode(rel.mbid, { mbid: rel.mbid, name: rel.name });
    addLink(node.id, rel.mbid, rel.type);
  }
}

// ── Rendering ────────────────────────────────────────────────────────────────

function initSvg() {
  const el = document.getElementById("graph");
  el.innerHTML = "";
  svg = d3.select(el);
  const W = el.clientWidth, H = el.clientHeight;

  const zoom = d3.zoom().scaleExtent([0.1,4])
    .on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);

  g      = svg.append("g");
  gLinks = g.append("g");
  gNodes = g.append("g");

  simulation = d3.forceSimulation()
    .force("link",  d3.forceLink().id(d=>d.id).distance(80).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-220).distanceMax(320))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collision", d3.forceCollide().radius(d => nodeRadius(d)+5))
    .alphaDecay(0.022)
    .on("tick", ticked);
}

function updateViz() {
  // Links
  gLinks.selectAll("line")
    .data(links, d => `${d.source?.id||d.source}→${d.target?.id||d.target}`)
    .join(enter => enter.append("line").attr("class","link")
      .attr("stroke-width", d => d.type === "member of band" ? 2 : 1))
    .classed("strong", d => d.type === "member of band" || d.type === "influenced by");

  // Nodes
  const nodeUpdate = gNodes.selectAll(".node-g")
    .data(nodes, d => d.id);

  const entered = nodeUpdate.enter().append("g").attr("class","node-g")
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag", (e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",  (e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on("click", (e,d) => selectNode(d));

  entered.append("circle").attr("class","node-circle");
  entered.append("text").attr("class","node-label");

  const merged = entered.merge(nodeUpdate);

  merged.select(".node-circle")
    .attr("r",    d => nodeRadius(d))
    .attr("fill", d => d.id===selectedNode?.id ? "var(--selected)" : artistColor(d))
    .attr("opacity", 0.85)
    .classed("selected", d => d.id===selectedNode?.id);

  merged.select(".node-label")
    .attr("dy", d => nodeRadius(d)+11)
    .attr("font-size", 10)
    .attr("fill", "var(--muted)")
    .text(d => d.name.length>18 ? d.name.slice(0,16)+"…" : d.name);

  nodeUpdate.exit().remove();

  simulation.nodes(nodes);
  simulation.force("link").links(links);
  simulation.alpha(0.3).restart();
  updateStats();
}

function ticked() {
  gLinks.selectAll("line")
    .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
    .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  gNodes.selectAll(".node-g")
    .attr("transform",d=>`translate(${d.x||0},${d.y||0})`);
}

// ── Sidebar ──────────────────────────────────────────────────────────────────

function selectNode(d) {
  selectedNode = d;
  gNodes.selectAll(".node-circle")
    .attr("fill", n => n.id===d.id ? "var(--selected)" : artistColor(n))
    .classed("selected", n => n.id===d.id);
  gLinks.selectAll("line")
    .classed("highlight", l =>
      (l.source?.id||l.source)===d.id || (l.target?.id||l.target)===d.id);

  document.getElementById("sb-name").textContent = d.name + (d.disambiguation ? ` (${d.disambiguation})` : "");
  document.getElementById("sb-name").style.color = "var(--text)";
  document.getElementById("sb-genres").textContent = (d.genres||[]).join(" · ") || "";

  const meta = document.getElementById("sb-meta");
  meta.innerHTML = `
    ${d.type      ? `<div class="meta-row"><span>Type</span><span class="meta-val">${d.type}</span></div>` : ""}
    ${d.country   ? `<div class="meta-row"><span>Country</span><span class="meta-val">${d.country}</span></div>` : ""}
    ${d.beginYear ? `<div class="meta-row"><span>Active</span><span class="meta-val">${d.beginYear}${d.endYear?"–"+d.endYear:"+"}` + `</span></div>` : ""}
    ${d.rating    ? `<div class="meta-row"><span>MB Rating</span><span class="meta-val">${d.rating}/5</span></div>` : ""}
  `;

  // Relations in graph
  const neighbors = links
    .filter(l => (l.source?.id||l.source)===d.id || (l.target?.id||l.target)===d.id)
    .map(l => {
      const oid = (l.source?.id||l.source)===d.id
        ? (l.target?.id||l.target) : (l.source?.id||l.source);
      return { node: nodeMap.get(oid), type: l.type };
    }).filter(n=>n.node);

  // Group by relation type
  const groups = {};
  neighbors.forEach(({node:n, type:t}) => {
    const key = t || "related";
    if (!groups[key]) groups[key] = [];
    groups[key].push(n);
  });

  const relEl = document.getElementById("sb-relations");
  relEl.innerHTML = "";
  Object.entries(groups).forEach(([type, artists]) => {
    const title = document.createElement("div");
    title.className = "rel-group-title";
    title.textContent = type;
    relEl.appendChild(title);
    artists.forEach(n => {
      const row = document.createElement("div");
      row.className = "rel-item";
      row.innerHTML = `
        <div class="rel-dot" style="background:${artistColor(n)}"></div>
        <div class="rel-name">${n.name}</div>
        ${n.genres?.length ? `<div class="rel-type">${n.genres[0]}</div>` : ""}`;
      row.onclick = () => selectNode(n);
      relEl.appendChild(row);
    });
  });

  if (!Object.keys(groups).length) {
    relEl.innerHTML = `<p style="font-size:12px;color:var(--muted);margin-top:8px">Expand this node to see connections.</p>`;
  }

  document.getElementById("expand-wrap").style.display = "block";
  const btn = document.getElementById("exp-btn");
  btn.disabled    = d.expanded;
  btn.textContent = d.expanded ? "✓ Already expanded" : "+ Expand this artist";
}

async function expandSelected() {
  if (!selectedNode || selectedNode.expanded) return;
  document.getElementById("exp-btn").disabled    = true;
  document.getElementById("exp-btn").textContent = "Expanding…";
  await expandArtist(selectedNode);
  showLoad(false);
  updateViz();
  selectNode(selectedNode);
}

async function startGraph() {
  const query = document.getElementById("seed-input").value.trim();
  if (!query) return;

  document.getElementById("start-btn").disabled = true;
  nodes=[]; links=[]; nodeMap=new Map(); selectedNode=null;
  showLoad(true, `Searching MusicBrainz for "${query}"…`);
  initSvg();

  const result = await searchArtist(query);
  if (!result) {
    showLoad(true, "Artist not found. Try a different name.");
    document.getElementById("start-btn").disabled = false;
    return;
  }

  const seed = addNode(result.id, { mbid: result.id, name: result.name });
  await expandArtist(seed);
  showLoad(false);
  updateViz();
  document.getElementById("start-btn").disabled = false;
}

function resetGraph() {
  if (simulation) simulation.stop();
  nodes=[]; links=[]; nodeMap=new Map(); selectedNode=null;
  document.getElementById("graph").innerHTML = "";
  document.getElementById("sb-name").textContent = "Click any node";
  document.getElementById("sb-name").style.color = "var(--muted)";
  document.getElementById("sb-genres").textContent = "";
  document.getElementById("sb-meta").innerHTML = "";
  document.getElementById("sb-relations").innerHTML =
    `<p style="font-size:12px;color:var(--muted);margin-top:8px">Start a graph and click any node to explore connections.</p>`;
  document.getElementById("expand-wrap").style.display = "none";
  document.getElementById("stats").textContent = "";
  showLoad(true, "Enter an artist and click Start.");
}

window.addEventListener("load", () => {
  initSvg();
  showLoad(true, "Enter an artist and click Start.");
});
</script>
</body>
</html>
