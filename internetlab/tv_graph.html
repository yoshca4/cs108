<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TV Connection Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0b0d12; --bg2:#11141c; --surface:#181c28;
  --border:rgba(255,255,255,0.08); --text:#e2e4ec; --muted:#6b7080;
  --show:#f97316; --person:#60a5fa; --selected:#fbbf24;
}
body { background:var(--bg); color:var(--text); font-family:'SF Mono','Fira Code',monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#toolbar { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
#toolbar h1 { font-size:13px; font-weight:600; color:var(--show); letter-spacing:.08em; text-transform:uppercase; }
input[type=text] { background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:inherit; font-size:13px; padding:5px 10px; outline:none; width:200px; }
input[type=text]:focus { border-color:var(--show); }
button { background:var(--show); border:none; border-radius:6px; color:#0b0d12; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; letter-spacing:.05em; padding:6px 14px; text-transform:uppercase; }
button.sec { background:var(--surface); color:var(--muted); border:1px solid var(--border); }
button:hover { opacity:.85; } button:disabled { opacity:.3; cursor:not-allowed; }
#stats { font-size:11px; color:var(--muted); margin-left:auto; }
#main { display:flex; flex:1; overflow:hidden; }
#canvas-wrap { flex:1; position:relative; overflow:hidden; }
svg#graph { width:100%; height:100%; }
.link { stroke:rgba(255,255,255,0.1); fill:none; }
.link.highlight { stroke:var(--selected); stroke-width:2; }
.node-circle { cursor:pointer; }
.node-circle:hover { filter:brightness(1.35); }
.node-circle.selected { stroke:#fff; stroke-width:2.5; }
.node-label { pointer-events:none; text-anchor:middle; font-family:inherit; fill:var(--muted); }
#sidebar { width:290px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
#sb-header { padding:12px 16px 8px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
#sb-type-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:3px; margin:10px 16px 0; }
#sb-name { font-size:16px; font-weight:700; padding:4px 16px 0; line-height:1.3; color:var(--text); }
#sb-meta { font-size:11px; color:var(--muted); padding:4px 16px 10px; line-height:1.9; border-bottom:1px solid var(--border); }
.meta-row { display:flex; justify-content:space-between; }
.meta-val { color:var(--text); font-weight:600; }
#sb-connections { flex:1; overflow-y:auto; padding:8px 16px; }
#sb-connections::-webkit-scrollbar { width:4px; }
#sb-connections::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.conn-item { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; }
.conn-item:hover .conn-name { color:#fff; }
.conn-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.conn-name { font-size:11px; color:var(--text); flex:1; }
.conn-sub { font-size:10px; color:var(--muted); }
#expand-btn { margin:10px 16px; }
#expand-btn button { width:100%; padding:7px; font-size:11px; }
#tvmaze-link { padding:4px 16px 10px; flex-shrink:0; }
#tvmaze-link a { font-size:11px; color:var(--show); text-decoration:none; }
#tvmaze-link a:hover { color:var(--text); }
#legend { padding:10px 16px; border-top:1px solid var(--border); flex-shrink:0; display:flex; gap:16px; flex-wrap:wrap; }
.leg-row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
.leg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
#loading { position:absolute; inset:0; background:rgba(11,13,18,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-size:13px; color:var(--muted); z-index:10; }
#loading.hidden { display:none; }
.spin { width:26px; height:26px; border:2px solid var(--border); border-top-color:var(--show); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="toolbar">
  <h1>📺 TV Graph</h1>
  <input id="seed-input" type="text" value="Breaking Bad" placeholder="TV show or actor name…" />
  <button id="start-btn" onclick="startGraph()">▶ Start</button>
  <button class="sec" onclick="resetGraph()">Reset</button>
  <span id="stats"></span>
</div>
<div id="main">
  <div id="canvas-wrap">
    <svg id="graph"></svg>
    <div id="loading">
      <div class="spin"></div>
      <span id="load-msg">Enter a TV show or actor and click Start.</span>
    </div>
  </div>
  <div id="sidebar">
    <div id="sb-header">Node details</div>
    <div id="sb-type-badge" style="display:none"></div>
    <div id="sb-name" style="color:var(--muted);font-size:13px;padding-top:16px">Click any node</div>
    <div id="sb-meta"></div>
    <div id="sb-connections">
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Start a graph then click a node to see its connections.</p>
    </div>
    <div id="expand-btn" style="display:none">
      <button id="exp-btn" onclick="expandSelected()">+ Expand this node</button>
    </div>
    <div id="tvmaze-link" style="display:none">
      <a id="tvmaze-anchor" href="#" target="_blank">↗ Open in TVmaze</a>
    </div>
    <div id="legend">
      <div class="leg-row"><div class="leg-dot" style="background:var(--show)"></div>TV Show</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--person)"></div>Person</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--selected)"></div>Selected</div>
    </div>
  </div>
</div>
<script>
const TV = "https://api.tvmaze.com";
const MAX_CAST   = 10;  // cast members per show
const MAX_SHOWS  = 7;   // shows per person

let nodes = [], links = [];
let nodeMap = new Map();
let selectedNode = null;
let simulation, svg, g, gLinks, gNodes;

function showLoad(on, msg) {
  document.getElementById("loading").classList.toggle("hidden", !on);
  if (msg) document.getElementById("load-msg").textContent = msg;
}
function updateStats() {
  document.getElementById("stats").textContent =
    `${nodes.length} nodes · ${links.length} edges`;
}

// ── TVmaze API ───────────────────────────────────────────────────────────────

async function searchShow(query) {
  const r = await fetch(`${TV}/search/shows?q=${encodeURIComponent(query)}`);
  const d = await r.json();
  return d[0]?.show || null;
}

async function searchPerson(query) {
  const r = await fetch(`${TV}/search/people?q=${encodeURIComponent(query)}`);
  const d = await r.json();
  return d[0]?.person || null;
}

async function getShowCast(showId) {
  const r = await fetch(`${TV}/shows/${showId}/cast`);
  const d = await r.json();
  // Each entry: { person: {...}, character: {...} }
  return d.slice(0, MAX_CAST);
}

async function getPersonCredits(personId) {
  const r = await fetch(`${TV}/people/${personId}/castcredits?embed=show`);
  const d = await r.json();
  return d
    .filter(c => c._embedded?.show)
    .sort((a, b) => (b._embedded.show.rating?.average || 0) - (a._embedded.show.rating?.average || 0))
    .slice(0, MAX_SHOWS);
}

async function getShowDetails(showId) {
  const r = await fetch(`${TV}/shows/${showId}`);
  return r.json();
}

// ── Graph state ──────────────────────────────────────────────────────────────

function addNode(id, data) {
  if (nodeMap.has(id)) { Object.assign(nodeMap.get(id), data); return nodeMap.get(id); }
  const n = { id, ...data, expanded: false };
  nodes.push(n);
  nodeMap.set(id, n);
  return n;
}

function addLink(sourceId, targetId, meta) {
  const key = [sourceId, targetId].sort().join("|||");
  const exists = links.some(l => {
    const s = l.source?.id || l.source, t = l.target?.id || l.target;
    return [s, t].sort().join("|||") === key;
  });
  if (!exists) links.push({ source: sourceId, target: targetId, ...meta });
}

async function expandShow(node) {
  if (node.expanded) return;
  node.expanded = true;
  showLoad(true, `Fetching cast: ${node.name}…`);

  const [cast, details] = await Promise.all([
    getShowCast(node.tvId),
    node.summary ? Promise.resolve(null) : getShowDetails(node.tvId),
  ]);

  if (details) {
    node.summary  = details.summary?.replace(/<[^>]+>/g, "") || "";
    node.rating   = details.rating?.average;
    node.network  = details.network?.name || details.webChannel?.name || "";
    node.premiered= details.premiered?.slice(0, 4) || "";
    node.status   = details.status;
    node.genres   = details.genres || [];
    node.tvmazeUrl= details.url;
  }

  cast.forEach(entry => {
    const p = entry.person;
    const pid = `person-${p.id}`;
    addNode(pid, {
      tvId:      p.id,
      type:      "person",
      name:      p.name,
      birthday:  p.birthday,
      country:   p.country?.name,
      tvmazeUrl: p.url,
      image:     p.image?.medium,
      character: entry.character?.name,
    });
    addLink(node.id, pid, { character: entry.character?.name });
  });
}

async function expandPerson(node) {
  if (node.expanded) return;
  node.expanded = true;
  showLoad(true, `Fetching credits: ${node.name}…`);

  const credits = await getPersonCredits(node.tvId);

  credits.forEach(c => {
    const show = c._embedded.show;
    const sid  = `show-${show.id}`;
    addNode(sid, {
      tvId:      show.id,
      type:      "show",
      name:      show.name,
      rating:    show.rating?.average,
      network:   show.network?.name || show.webChannel?.name || "",
      premiered: show.premiered?.slice(0, 4) || "",
      status:    show.status,
      genres:    show.genres || [],
      summary:   show.summary?.replace(/<[^>]+>/g, "") || "",
      tvmazeUrl: show.url,
    });
    addLink(node.id, sid, {});
  });
}

// ── Show color by genre ──────────────────────────────────────────────────────

const GENRE_COLORS = {
  Drama:      "#f97316", Comedy:    "#fbbf24", Thriller:  "#ef4444",
  Crime:      "#f87171", Action:    "#fb923c", Horror:    "#c026d3",
  Science:    "#60a5fa", Fantasy:   "#a78bfa", Adventure: "#34d399",
  Romance:    "#f472b6", Mystery:   "#38bdf8", Anime:     "#4ade80",
};

function showColor(d) {
  if (d.type === "person") return "var(--person)";
  const genre = d.genres?.[0];
  return GENRE_COLORS[genre] || "var(--show)";
}

function nodeRadius(d) {
  if (d.id === nodes[0]?.id) return 18;
  if (d.type === "show") {
    const r = d.rating || 5;
    return 8 + (r / 10) * 8;
  }
  return 9;
}

// ── Rendering ────────────────────────────────────────────────────────────────

function initSvg() {
  const el = document.getElementById("graph");
  el.innerHTML = "";
  svg = d3.select(el);
  const W = el.clientWidth, H = el.clientHeight;

  const zoom = d3.zoom().scaleExtent([0.1, 4])
    .on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);

  g      = svg.append("g");
  gLinks = g.append("g");
  gNodes = g.append("g");

  simulation = d3.forceSimulation()
    .force("link",  d3.forceLink().id(d => d.id).distance(85).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-240).distanceMax(340))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collision", d3.forceCollide().radius(d => nodeRadius(d) + 5))
    .alphaDecay(0.022)
    .on("tick", ticked);
}

function updateViz() {
  gLinks.selectAll("line")
    .data(links, d => {
      const s = d.source?.id || d.source, t = d.target?.id || d.target;
      return [s, t].sort().join("|||");
    })
    .join(enter => enter.append("line").attr("class", "link")
      .attr("opacity", 0).call(e => e.transition().duration(300).attr("opacity", 1)));

  const nodeUpdate = gNodes.selectAll(".node-g")
    .data(nodes, d => d.id);

  const entered = nodeUpdate.enter().append("g").attr("class", "node-g")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end",   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on("click", (e, d) => selectNode(d));

  entered.append("circle").attr("class", "node-circle");
  entered.append("text").attr("class", "node-label");

  const merged = entered.merge(nodeUpdate);

  merged.select(".node-circle")
    .attr("r",    d => nodeRadius(d))
    .attr("fill", d => d.id === selectedNode?.id ? "var(--selected)" : showColor(d))
    .attr("opacity", 0.85)
    .classed("selected", d => d.id === selectedNode?.id);

  merged.select(".node-label")
    .attr("dy", d => nodeRadius(d) + 11)
    .attr("font-size", 10)
    .text(d => d.name.length > 18 ? d.name.slice(0, 16) + "…" : d.name);

  nodeUpdate.exit().remove();

  simulation.nodes(nodes);
  simulation.force("link").links(links);
  simulation.alpha(0.3).restart();
  updateStats();
}

function ticked() {
  gLinks.selectAll("line")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  gNodes.selectAll(".node-g")
    .attr("transform", d => `translate(${d.x || 0},${d.y || 0})`);
}

// ── Sidebar ──────────────────────────────────────────────────────────────────

function selectNode(d) {
  selectedNode = d;

  gNodes.selectAll(".node-circle")
    .attr("fill", n => n.id === d.id ? "var(--selected)" : showColor(n))
    .classed("selected", n => n.id === d.id);
  gLinks.selectAll("line")
    .classed("highlight", l =>
      (l.source?.id || l.source) === d.id || (l.target?.id || l.target) === d.id);

  const badge = document.getElementById("sb-type-badge");
  badge.style.display  = "inline-block";
  badge.textContent    = d.type === "show" ? "TV SHOW" : "PERSON";
  badge.style.background = d.type === "show" ? "rgba(249,115,22,.15)" : "rgba(96,165,250,.15)";
  badge.style.color      = d.type === "show" ? "var(--show)" : "var(--person)";

  document.getElementById("sb-name").textContent = d.name;
  document.getElementById("sb-name").style.color = "var(--text)";

  const meta = document.getElementById("sb-meta");
  if (d.type === "show") {
    meta.innerHTML = `
      ${d.network   ? `<div class="meta-row"><span>Network</span><span class="meta-val">${d.network}</span></div>` : ""}
      ${d.premiered ? `<div class="meta-row"><span>Premiered</span><span class="meta-val">${d.premiered}</span></div>` : ""}
      ${d.status    ? `<div class="meta-row"><span>Status</span><span class="meta-val">${d.status}</span></div>` : ""}
      ${d.rating    ? `<div class="meta-row"><span>Rating</span><span class="meta-val">⭐ ${d.rating}/10</span></div>` : ""}
      ${d.genres?.length ? `<div class="meta-row"><span>Genres</span><span class="meta-val">${d.genres.join(", ")}</span></div>` : ""}
      ${d.summary   ? `<div style="margin-top:6px;font-size:11px;color:#b0b4cc;line-height:1.6">${d.summary.slice(0, 220)}${d.summary.length > 220 ? "…" : ""}</div>` : ""}
    `;
  } else {
    meta.innerHTML = `
      ${d.birthday ? `<div class="meta-row"><span>Born</span><span class="meta-val">${d.birthday}</span></div>` : ""}
      ${d.country  ? `<div class="meta-row"><span>Country</span><span class="meta-val">${d.country}</span></div>` : ""}
      ${d.character ? `<div class="meta-row"><span>Character</span><span class="meta-val">${d.character}</span></div>` : ""}
    `;
  }

  // Connections already in graph
  const neighbors = links
    .filter(l => (l.source?.id || l.source) === d.id || (l.target?.id || l.target) === d.id)
    .map(l => {
      const oid = (l.source?.id || l.source) === d.id
        ? (l.target?.id || l.target) : (l.source?.id || l.source);
      return { node: nodeMap.get(oid), character: l.character };
    })
    .filter(n => n.node);

  const connEl = document.getElementById("sb-connections");
  connEl.innerHTML = `<p style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">${neighbors.length} connections in graph</p>`;
  neighbors.forEach(({ node: n, character }) => {
    const row = document.createElement("div");
    row.className = "conn-item";
    row.innerHTML = `
      <div class="conn-dot" style="background:${showColor(n)}"></div>
      <div>
        <div class="conn-name">${n.name}</div>
        <div class="conn-sub">${n.type === "show"
          ? [n.network, n.premiered].filter(Boolean).join(" · ")
          : character || n.character || ""}</div>
      </div>`;
    row.onclick = () => selectNode(n);
    connEl.appendChild(row);
  });

  document.getElementById("expand-btn").style.display = "block";
  const btn = document.getElementById("exp-btn");
  btn.disabled    = d.expanded;
  btn.textContent = d.expanded ? "✓ Already expanded" : "+ Expand this node";

  const linkEl = document.getElementById("tvmaze-link");
  if (d.tvmazeUrl) {
    linkEl.style.display = "block";
    document.getElementById("tvmaze-anchor").href = d.tvmazeUrl;
    document.getElementById("tvmaze-anchor").textContent = `↗ Open in TVmaze`;
  } else {
    linkEl.style.display = "none";
  }
}

async function expandSelected() {
  if (!selectedNode || selectedNode.expanded) return;
  document.getElementById("exp-btn").disabled    = true;
  document.getElementById("exp-btn").textContent = "Expanding…";

  if (selectedNode.type === "show") await expandShow(selectedNode);
  else                               await expandPerson(selectedNode);

  showLoad(false);
  updateViz();
  selectNode(selectedNode);
}

async function startGraph() {
  const query = document.getElementById("seed-input").value.trim();
  if (!query) return;

  document.getElementById("start-btn").disabled = true;
  nodes = []; links = []; nodeMap = new Map(); selectedNode = null;
  showLoad(true, `Searching TVmaze for "${query}"…`);
  initSvg();

  // Try show first, then person
  let show = await searchShow(query);
  if (show) {
    const seed = addNode(`show-${show.id}`, {
      tvId:      show.id,
      type:      "show",
      name:      show.name,
      rating:    show.rating?.average,
      network:   show.network?.name || show.webChannel?.name || "",
      premiered: show.premiered?.slice(0, 4) || "",
      status:    show.status,
      genres:    show.genres || [],
      summary:   show.summary?.replace(/<[^>]+>/g, "") || "",
      tvmazeUrl: show.url,
    });
    await expandShow(seed);
  } else {
    const person = await searchPerson(query);
    if (!person) {
      showLoad(true, "Nothing found — try a different name.");
      document.getElementById("start-btn").disabled = false;
      return;
    }
    const seed = addNode(`person-${person.id}`, {
      tvId:      person.id,
      type:      "person",
      name:      person.name,
      birthday:  person.birthday,
      country:   person.country?.name,
      tvmazeUrl: person.url,
    });
    await expandPerson(seed);
  }

  showLoad(false);
  updateViz();
  document.getElementById("start-btn").disabled = false;
}

function resetGraph() {
  if (simulation) simulation.stop();
  nodes = []; links = []; nodeMap = new Map(); selectedNode = null;
  document.getElementById("graph").innerHTML = "";
  document.getElementById("sb-type-badge").style.display = "none";
  document.getElementById("sb-name").textContent = "Click any node";
  document.getElementById("sb-name").style.color = "var(--muted)";
  document.getElementById("sb-meta").innerHTML   = "";
  document.getElementById("sb-connections").innerHTML =
    `<p style="font-size:12px;color:var(--muted);margin-top:8px">Start a graph then click a node to see its connections.</p>`;
  document.getElementById("expand-btn").style.display   = "none";
  document.getElementById("tvmaze-link").style.display  = "none";
  document.getElementById("stats").textContent = "";
  showLoad(true, "Enter a TV show or actor and click Start.");
}

window.addEventListener("load", () => {
  initSvg();
  showLoad(true, "Enter a TV show or actor and click Start.");
});
</script>
</body>
</html>
